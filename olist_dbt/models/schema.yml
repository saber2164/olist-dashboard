version: 2

models:
  - name: fct_order_items
    description: "Fact table recording individual order items with pricing, delivery SLAs, and key foreign keys."
    columns:
      - name: order_item_key
        description: "Surrogate primary key for each order item record."
        tests:
          - unique
          - not_null

      - name: order_id
        description: "Foreign key reference to orders."
        tests:
          - not_null

      - name: order_item_id
        description: "Item sequence number within an order."
        tests:
          - not_null

      - name: customer_id
        description: "Customer who placed the order."
        tests:
          - not_null

      - name: product_id
        description: "Foreign key reference to products."
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id

      - name: seller_id
        description: "Foreign key reference to sellers."
        tests:
          - not_null
          - relationships:
              to: ref('stg_sellers')
              field: seller_id

      - name: order_status
        description: "Status of the order."
        tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'invoiced', 'processing', 'created', 'approved', 'unavailable']

      - name: price
        description: "Item price in BRL."
        tests:
          - not_null

      - name: freight_value
        description: "Freight cost in BRL."
        tests:
          - not_null

      - name: total_item_cost
        description: "price + freight_value."
        tests:
          - not_null

      - name: delivery_delay_days
        description: "Days delivered late (negative = early)."

      - name: order_purchase_timestamp
        description: "When the order was placed."
        tests:
          - not_null

  - name: dim_customers
    description: "Dimension table containing customer demographic and geography details."
    columns:
      - name: customer_id
        description: "Unique customer identifier."
        tests:
          - unique
          - not_null

      - name: customer_key
        description: "Surrogate key = customer_unique_id."
        tests:
          - not_null

      - name: customer_zip_code_prefix
        description: "Customer zip code prefix."

      - name: customer_city
        description: "Customer city."

      - name: customer_state
        description: "Customer state (Brazilian state abbreviation, e.g. SP, RJ)."
