name: 'olist_dbt'
version: '1.0.0'
profile: 'olist_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  olist_dbt:
    staging:
      +materialized: view
      +schema: main
    intermediate:
      +materialized: view
      +schema: main
    marts:
      +materialized: table
      +schema: main

on-run-start:
  - "CREATE SCHEMA IF NOT EXISTS main"
  - "CREATE SCHEMA IF NOT EXISTS main_raw"
  - "CREATE SCHEMA IF NOT EXISTS snapshots"
